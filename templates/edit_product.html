{% extends "base.html" %}

{% block title %}Edit Product{% endblock %}

{% block content %}

<h1>✏️ Edit Product</h1>

<form method="POST" class="form-container">

    <div class="form-group">
        <label>Product Name *</label>
        <input type="text" name="name" value="{{ product.name }}" required>
    </div>

    <div class="form-group">
        <label>Description</label>
        <textarea name="description">{{ product.description or '' }}</textarea>
    </div>

    <div class="form-group">
        <label>Price (₹) *</label>
        <input type="number" step="0.01" name="price" value="{{ product.price }}" required>
    </div>

    <div class="form-group">
        <label>Stock Quantity *</label>
        <input type="number" name="stock_quantity" value="{{ product.stock_quantity }}" required>
    </div>

    <div style="display: flex; gap: 12px;">
        <button type="submit" class="btn btn-primary" style="flex: 1;">💾 Update Product</button>
        <a href="/products" class="btn btn-secondary" style="flex: 1; text-align: center;">Cancel</a>
    </div>

</form>

{% endblock %}
