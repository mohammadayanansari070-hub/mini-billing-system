{% extends "base.html" %}

{% block title %}Add Product{% endblock %}

{% block content %}

<h1>➕ Add New Product</h1>

<form method="POST" class="form-container">

    <div class="form-group">
        <label>Product Name *</label>
        <input type="text" name="name" placeholder="e.g. Laptop" required>
    </div>

    <div class="form-group">
        <label>Description</label>
        <textarea name="description" placeholder="Short description of the product"></textarea>
    </div>

    <div class="form-group">
        <label>Price (₹) *</label>
        <input type="number" step="0.01" name="price" placeholder="e.g. 75000" required>
    </div>

    <div class="form-group">
        <label>Stock Quantity *</label>
        <input type="number" name="stock_quantity" placeholder="e.g. 10" required>
    </div>

    <div style="display: flex; gap: 12px;">
        <button type="submit" class="btn btn-success" style="flex: 1;">✅ Add Product</button>
        <a href="/products" class="btn btn-secondary" style="flex: 1; text-align: center;">Cancel</a>
    </div>

</form>

{% endblock %}
