{% extends "base.html" %}

{% block title %}Settings{% endblock %}

{% block content %}

<h1>⚙️ Settings</h1>

<form method="POST" class="form-container">

    <div class="form-group">
        <label>Shop Name</label>
        <input type="text" name="shop_name" value="{{ shop_name }}" required
               placeholder="e.g. Ayan General Store">
    </div>

    <div style="display: flex; gap: 12px;">
        <button type="submit" class="btn btn-primary" style="flex: 1;">💾 Save Settings</button>
        <a href="/" class="btn btn-secondary" style="flex: 1; text-align: center;">Cancel</a>
    </div>

</form>

{% endblock %}
